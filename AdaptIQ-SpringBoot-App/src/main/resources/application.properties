server.port=8080
spring.application.name=adaptiq

# JSON
spring.jackson.mapper.accept-case-insensitive-enums=true
spring.jackson.serialization.write-dates-as-timestamps=false

# OpenAPI / Swagger UI (NFR-M1)  ->  /swagger-ui.html and /v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# AdaptIQ settings
adaptiq.seed-demo-data=true
adaptiq.semester.total-weeks=12
adaptiq.semester.elapsed-weeks=8
